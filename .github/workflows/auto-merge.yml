name: Auto Merge Pull Requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to merge (optional, leave empty for current context)'
        required: false
        type: string

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "Attempting to auto-merge PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --auto --merge || gh pr merge "$PR_NUMBER" --merge --admin
          else
            echo "No PR number provided or context found. Listing open PRs to merge..."
            prs=$(gh pr list --json number -q '.[].number')
            for pr in $prs; do
              echo "Merging PR #$pr..."
              gh pr merge "$pr" --auto --merge || gh pr merge "$pr" --merge --admin || true
            done
          fi
