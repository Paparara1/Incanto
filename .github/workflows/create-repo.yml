name: Create GitHub Repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Name of the new repository'
        required: true
        type: string
      visibility:
        description: 'Visibility (public or private)'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - private
      description:
        description: 'Repository description'
        required: false
        default: 'Incanto Portfolio Project Repository'
        type: string

jobs:
  create-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Repo Creation Script
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/create-repo.sh "${{ github.event.inputs.repo_name }}" "${{ github.event.inputs.visibility }}" "${{ github.event.inputs.description }}"
