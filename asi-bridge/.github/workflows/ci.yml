name: ASI BRIDGE CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r asi-bridge/requirements.txt

      - name: Sprawdzenie formatowania i statyczna analiza kodu (Linting)
        run: |
          flake8 asi-bridge --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check asi-bridge

      - name: Uruchomienie testów jednostkowych (Pytest)
        run: |
          PYTHONPATH=asi-bridge pytest asi-bridge/tests
