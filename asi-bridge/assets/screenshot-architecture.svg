<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0f1724"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Title -->
    <text x="40" y="48" fill="#ffffff" font-size="28" font-weight="700">ASI BRIDGE — Architecture</text>
    <!-- Boxes -->
    <rect x="80" y="100" width="300" height="120" rx="10" fill="#0b74de"/>
    <text x="230" y="170" fill="#fff" font-size="16" text-anchor="middle">Input: Human Intent</text>

    <rect x="460" y="100" width="360" height="160" rx="10" fill="#1f2937" stroke="#9fe3ff" stroke-width="2"/>
    <text x="640" y="130" fill="#9fe3ff" font-size="16" text-anchor="middle" font-weight="700">ASI BRIDGE</text>
    <text x="640" y="150" fill="#cbd5e1" font-size="14" text-anchor="middle">Intent Engine • Auth Gate • Telemetry</text>

    <rect x="900" y="100" width="260" height="120" rx="10" fill="#06b6d4"/>
    <text x="1030" y="170" fill="#022c2e" font-size="16" text-anchor="middle">Sovereign Artifacts</text>

    <!-- Arrows -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0 0 L10 5 L0 10 z" fill="#9fe3ff" />
      </marker>
    </defs>
    <line x1="380" y1="160" x2="460" y2="160" stroke="#9fe3ff" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="820" y1="160" x2="900" y2="160" stroke="#9fe3ff" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Notes -->
    <text x="80" y="260" fill="#cbd5e1" font-size="14">Flow: Intent → Compile (Spec) → Verify (Identity) → Telemetry Guard → Artifact Export</text>

    <!-- Footer -->
    <text x="40" y="610" fill="#94a3b8" font-size="12">Twoja intencja. Twoja technologia. Twoja własność. — ASI BRIDGE</text>
  </g>
</svg>
