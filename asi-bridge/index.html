<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agencja Suwerennej Inteligencji - ASI BRIDGE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: radial-gradient(circle at top, #1e293b, #0f172a); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .container { max-width: 640px; width: 100%; background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; backdrop-filter: blur(12px); border-radius: 16px; padding: 40px 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
    .badge { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #38bdf8; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 14px; border-radius: 999px; margin-bottom: 24px; }
    .headline { font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; letter-spacing: -0.5px; }
    .headline span { color: #38bdf8; }
    .subline { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
    .input-box { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; padding: 14px 16px; font-size: 15px; outline: none; transition: border-color 0.2s; margin-bottom: 16px; }
    .input-box:focus { border-color: #38bdf8; }
    .btn { width: 100%; background: #38bdf8; color: #0f172a; font-weight: 600; border: none; padding: 14px; border-radius: 8px; font-size: 15px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
    .btn:hover { opacity: 0.95; }
    .btn:active { transform: scale(0.98); }
    .output-card { margin-top: 24px; padding: 18px; border-radius: 8px; background: #020617; border: 1px dashed #334155; text-align: left; font-family: monospace; font-size: 13px; color: #34d399; display: none; }
    .pillars { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; font-size: 12px; color: #64748b; }
    .pillar-item { flex: 1; }
    .pillar-item strong { display: block; color: #cbd5e1; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Agencja Suwerennej Inteligencji</div>
    <h1 class="headline"> Twoja intencja.<br> <span>Twoja technologia.</span><br> Twoja własność. </h1>
    <p class="subline"> Nie buduj w cudzej klatce. Zamień intencję w niezależny system. </p>
    <input type="text" id="intentInput" class="input-box" placeholder="Wpisz swoją intencję (np. Zbuduj suwerenny skarbiec danych)..." />
    <button class="btn" onclick="compileIntent()">Skompiluj do Aktywa</button>
    <div id="output" class="output-card"></div>
    <div class="pillars">
      <div class="pillar-item"> <strong>1. Intencja</strong> Twój cel </div>
      <div class="pillar-item"> <strong>2. Technologia</strong> Czysty kod </div>
      <div class="pillar-item"> <strong>3. Własność</strong> Zero Lock-in </div>
    </div>
  </div>
  <script>
    function compileIntent() {
      const input = document.getElementById('intentInput').value.trim();
      const output = document.getElementById('output');
      if (!input) {
        alert("Wpisz intencję przed kompilacją.");
        return;
      }
      output.style.display = 'block';
      output.innerHTML = `
        <span style="color: #94a3b8;">// Dekompozycja intencji...</span><br>
        > <strong>INTENCJA:</strong> "${input}"<br>
        > <strong>STATUS:</strong> Weryfikacja Zero-Trust... OK<br>
        > <strong>ŚRODOWISKO:</strong> Czysty kontener Docker wygenerowany<br>
        > <strong>WŁASNOŚĆ:</strong> 100% kluczy w Twoich rękach.<br>
        <span style="color: #38bdf8;">✔ System jest gotowy do pobrania i niezależnego wdrożenia.</span>
      `;
    }
  </script>
</body>
</html>
